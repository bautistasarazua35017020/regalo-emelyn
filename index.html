<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te amo porque...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3E7;
    --clay:#C9723F;
    --clay-dark:#8E4E2A;
    --leaf:#5E9C5E;
    --leaf-dark:#3F7A44;
    --petal:#F4B93E;
    --petal-center:#7A4A2A;
    --ink:#3A2E27;
    --ink-soft:#6B5B50;
    --card-bg:#FFFDF9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:var(--cream);
    font-family:"Inter",system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));
    overflow-x:hidden;
  }
  .scene{
    width:100%;
    max-width:400px;
    text-align:center;
    position:relative;
  }
  .to{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0 0 4px;
    letter-spacing:0.01em;
  }
  .title{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:2rem;
    line-height:1.15;
    margin:0 0 28px;
    color:var(--ink);
  }
  .reasons{
    list-style:none;
    margin:0 0 8px;
    padding:0;
    min-height:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .reason{
    opacity:0;
    transform:translateY(10px);
    transition:opacity .55s ease, transform .55s ease;
    font-size:1.02rem;
    color:var(--ink);
  }
  .reason.show{opacity:1; transform:translateY(0);}
  .final-lead{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--clay-dark);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .55s ease, transform .55s ease;
    margin:18px 0 0;
  }
  .final-lead.show{opacity:1; transform:translateY(0);}

  .plant-wrap{
    margin-top:10px;
    width:100%;
    max-width:280px;
    margin-left:auto;
    margin-right:auto;
  }
  #plant{width:100%; height:auto; display:block;}
  #stem{
    fill:none;
    stroke:var(--leaf-dark);
    stroke-width:5;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s cubic-bezier(.22,.9,.32,1);
  }
  .leaf-pair{
    opacity:0;
    transform:scale(0.3);
    transform-box:fill-box;
    transform-origin:center;
    transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .leaf-pair.show{opacity:1; transform:scale(1);}
  .leaf{fill:var(--leaf);}

  #bloomGroup{
    opacity:0;
    transform:scale(0.2);
    transform-box:fill-box;
    transform-origin:120px 55px;
    transition:opacity .6s ease, transform .7s cubic-bezier(.34,1.56,.64,1);
  }
  #bloomGroup.show{opacity:1; transform:scale(1);}
  .petal{fill:var(--petal);}
  .petal-center{fill:var(--petal-center);}

  /* Final card */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(58,46,39,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
    z-index:20;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .final-card{
    background:var(--card-bg);
    border-radius:20px;
    padding:32px 26px;
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(58,46,39,0.25);
    transform:translateY(16px) scale(0.97);
    transition:transform .4s cubic-bezier(.22,.9,.32,1);
  }
  .overlay.show .final-card{transform:translateY(0) scale(1);}
  .final-heart{font-size:1.8rem; margin:0 0 12px;}
  .final-message{
    font-size:1.02rem;
    line-height:1.5;
    color:var(--ink);
    margin:0 0 24px;
  }
  .cta-button{
    background:var(--clay);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:14px 22px;
    font-family:"Inter",sans-serif;
    font-size:0.98rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .cta-button:hover{background:var(--clay-dark);}
  .cta-button:active{transform:scale(0.96);}

  #confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:30;
  }

  #soundToggle{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top,0px));
    right:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:var(--card-bg);
    box-shadow:0 6px 16px rgba(58,46,39,0.2);
    font-size:1.1rem;
    cursor:pointer;
    z-index:40;
  }

  @media (prefers-reduced-motion: reduce){
    .reason, .final-lead, .leaf-pair, #bloomGroup, .final-card, .overlay{
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="scene">
    <p class="to" id="toLine"></p>
    <h1 class="title">Te amo porque:</h1>

    <ul class="reasons" id="reasonsList"></ul>
    <p class="final-lead" id="finalLead"></p>

    <div class="plant-wrap">
      <svg id="plant" viewBox="0 0 240 340" xmlns="http://www.w3.org/2000/svg">
        <!-- Maceta -->
        <path d="M70,250 L170,250 L155,312 L85,312 Z" fill="var(--clay)"/>
        <ellipse cx="120" cy="250" rx="52" ry="11" fill="var(--clay-dark)"/>
        <ellipse cx="120" cy="249" rx="44" ry="7" fill="#5B3A29"/>

        <!-- Tallo -->
        <path id="stem" d="M120,248 L120,55"/>

        <!-- Pares de hojas (uno por razon) -->
        <g class="leaf-pair" data-stage="1">
          <ellipse class="leaf" cx="96" cy="225" rx="22" ry="10" transform="rotate(-24 96 225)"/>
          <ellipse class="leaf" cx="144" cy="223" rx="22" ry="10" transform="rotate(24 144 223)"/>
        </g>
        <g class="leaf-pair" data-stage="2">
          <ellipse class="leaf" cx="92" cy="196" rx="24" ry="11" transform="rotate(-30 92 196)"/>
          <ellipse class="leaf" cx="148" cy="194" rx="24" ry="11" transform="rotate(30 148 194)"/>
        </g>
        <g class="leaf-pair" data-stage="3">
          <ellipse class="leaf" cx="94" cy="167" rx="23" ry="10" transform="rotate(-20 94 167)"/>
          <ellipse class="leaf" cx="146" cy="165" rx="23" ry="10" transform="rotate(20 146 165)"/>
        </g>
        <g class="leaf-pair" data-stage="4">
          <ellipse class="leaf" cx="97" cy="138" rx="21" ry="9" transform="rotate(-28 97 138)"/>
          <ellipse class="leaf" cx="143" cy="136" rx="21" ry="9" transform="rotate(28 143 136)"/>
        </g>
        <g class="leaf-pair" data-stage="5">
          <ellipse class="leaf" cx="99" cy="110" rx="19" ry="9" transform="rotate(-22 99 110)"/>
          <ellipse class="leaf" cx="141" cy="108" rx="19" ry="9" transform="rotate(22 141 108)"/>
        </g>

        <!-- Girasol final -->
        <g id="bloomGroup">
          <g id="petals"></g>
          <circle class="petal-center" cx="120" cy="55" r="17"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="final-card">
      <p class="final-heart">🤍</p>
      <p class="final-message" id="finalMessage"></p>
      <button class="cta-button" id="ctaButton"></button>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  <button id="soundToggle" hidden>🔊</button>
  <div id="yt-player" style="position:absolute;width:0;height:0;overflow:hidden;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* =========================================================
   ✏️  EDITA AQUÍ TUS PROPIOS TEXTOS Y LA CANCIÓN
   ========================================================= */
const CONFIG = {
  recipientName: "Emelyn",              // A quién va dirigida
  reasons: [
    "Por tu risa, que arregla cualquier día",
    "Por cómo cuidas cada detalle sin que nadie te lo pida",
    "Por ser el lugar al que siempre quiero volver",
    "Por tu forma única de ver la vida",
    "Por inspirarme a ser mejor cada día"
  ],
  finalLead: "Pero sobre todo, te amo por…",
  cardMessage: "Contigo hasta lo simple se siente especial. Gracias por tanto.",
  ctaLabel: "Ver la flor de mi amor 🌻",
  // ID del video de YouTube (lo que va después de youtu.be/ )
  youtubeId: "uZO-P4ukFxE"
};
/* ========================================================= */

document.getElementById('toLine').textContent = "Para " + CONFIG.recipientName;
document.getElementById('finalMessage').textContent = CONFIG.cardMessage;
document.getElementById('ctaButton').textContent = CONFIG.ctaLabel;

const reasonsList = document.getElementById('reasonsList');
const finalLead = document.getElementById('finalLead');
const stem = document.getElementById('stem');
const leafPairs = [...document.querySelectorAll('.leaf-pair')];
const overlay = document.getElementById('overlay');
const bloomGroup = document.getElementById('bloomGroup');

const STAGE_MAX = CONFIG.reasons.length + 1; // +1 = etapa de floración

// Preparar el trazo del tallo para animarlo con stroke-dashoffset
const stemLength = stem.getTotalLength();
stem.style.strokeDasharray = stemLength;
stem.style.strokeDashoffset = stemLength;

// Generar los pétalos del girasol (10, repartidos en círculo)
const petalsGroup = document.getElementById('petals');
for (let i = 0; i < 10; i++) {
  const angle = i * 36;
  const petal = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
  petal.setAttribute("class", "petal");
  petal.setAttribute("cx", "120");
  petal.setAttribute("cy", "33");
  petal.setAttribute("rx", "13");
  petal.setAttribute("ry", "23");
  petal.setAttribute("transform", `rotate(${angle} 120 55)`);
  petalsGroup.appendChild(petal);
}

function growStem(stage) {
  const progress = stage / STAGE_MAX;
  stem.style.strokeDashoffset = String(stemLength * (1 - progress));
}

function revealReason(index) {
  const li = document.createElement('li');
  li.className = 'reason';
  li.textContent = CONFIG.reasons[index];
  reasonsList.appendChild(li);
  requestAnimationFrame(() => li.classList.add('show'));
  growStem(index + 1);
  if (leafPairs[index]) leafPairs[index].classList.add('show');
}

function showFinalCard() {
  finalLead.textContent = CONFIG.finalLead;
  finalLead.classList.add('show');
  setTimeout(() => overlay.classList.add('show'), 500);
}

function startSequence() {
  CONFIG.reasons.forEach((_, i) => {
    setTimeout(() => revealReason(i), 700 + i * 1100);
  });
  const totalDelay = 700 + CONFIG.reasons.length * 1100 + 700;
  setTimeout(showFinalCard, totalDelay);
}
window.addEventListener('load', startSequence);

document.getElementById('ctaButton').addEventListener('click', () => {
  overlay.classList.remove('show');
  growStem(STAGE_MAX);
  bloomGroup.classList.add('show');
  launchConfetti();
  playMusic();
});

/* ---------- Confetti ---------- */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#F4B93E', '#C9723F', '#5E9C5E', '#F2A6B9', '#FFFDF9'];
  const particles = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.4,
    r: 4 + Math.random() * 5,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3,
    vx: -1.2 + Math.random() * 2.4,
    rot: Math.random() * 360,
    vr: -6 + Math.random() * 12
  }));
  let frames = 0;
  const maxFrames = 260;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
      ctx.restore();
    });
    frames++;
    if (frames < maxFrames) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}
window.addEventListener('resize', () => {
  const c = document.getElementById('confetti');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
});

/* ---------- Música de fondo (YouTube) ---------- */
let ytPlayer;
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '0',
    width: '0',
    videoId: CONFIG.youtubeId,
    playerVars: { autoplay: 0, controls: 0 },
    events: {
      onReady: () => { ytPlayer.setVolume(60); }
    }
  });
}
function playMusic() {
  if (ytPlayer && ytPlayer.playVideo) {
    ytPlayer.playVideo();
    document.getElementById('soundToggle').hidden = false;
  }
}
document.getElementById('soundToggle').addEventListener('click', () => {
  const btn = document.getElementById('soundToggle');
  if (!ytPlayer || !ytPlayer.getPlayerState) return;
  const state = ytPlayer.getPlayerState();
  if (state === 1) {
    ytPlayer.pauseVideo();
    btn.textContent = '🔈';
  } else {
    ytPlayer.playVideo();
    btn.textContent = '🔊';
  }
});
</script>
</body>
</html>
